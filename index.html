<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 글로벌인재포럼 & 지식 공유 디지털 서재</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-wood: #1a1614;
      --shelf-color: #2b1d14;
      --shelf-lip: #1c130d;
      --card-bg: #232228;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e2029 0%, #0d0f14 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: rgba(13, 15, 20, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 28px;
    }
    .header-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-icon {
      font-size: 32px;
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-title h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-title p {
      font-size: 13px;
      color: var(--text-sub);
    }
    .search-filter-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 520px;
    }
    .search-input {
      flex: 1;
      background: #1b1c23;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-add-pdf {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .btn-add-pdf:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
    }
    .btn-share-collection {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-share-collection:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1440px;
      margin: 20px auto 10px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .day-tabs {
      display: flex;
      gap: 6px;
      background: #15161c;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }
    .day-tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .day-tab-btn .badge-pill {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
    }
    .day-tab-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    .day-tab-btn.active .badge-pill {
      background: rgba(0, 0, 0, 0.25);
    }
    .stats-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .stats-badge strong {
      color: #60a5fa;
    }

    /* Bookshelf Grid */
    .bookshelf-stage {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .shelf-section {
      background: linear-gradient(180deg, rgba(30, 32, 42, 0.6) 0%, rgba(20, 22, 28, 0.9) 100%);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .shelf-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 10px;
    }
    .shelf-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .shelf-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-vista { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-walker { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-grand { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-web { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .book-card {
      background: #1b1c24;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s, border-color 0.25s;
      position: relative;
    }
    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
    }
    .book-card.highlight {
      animation: pulseBorder 1.5s infinite alternate;
    }
    @keyframes pulseBorder {
      from { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
      to { border-color: #ec4899; box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); }
    }

    .book-banner {
      padding: 16px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .banner-c1 { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%); }
    .banner-c2 { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); }
    .banner-c3 { background: linear-gradient(135deg, #701a75 0%, #3b0764 100%); }
    .banner-c4 { background: linear-gradient(135deg, #7c2d12 0%, #451a03 100%); }
    .banner-c5 { background: linear-gradient(135deg, #164e63 0%, #082f49 100%); }
    .banner-c6 { background: linear-gradient(135deg, #3730a3 0%, #1e1b4b 100%); }
    .banner-web { background: linear-gradient(135deg, #be123c 0%, #4c0519 100%); }

    .book-id-tag {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .book-title {
      font-family: 'Noto Serif KR', Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      min-height: 42px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 16px;
    }
    .author-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .author-name {
      font-size: 15px;
      font-weight: 700;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .author-role {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .author-affil {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .web-summary {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid #f43f5e;
      margin-top: 6px;
      line-height: 1.4;
    }
    .book-meta {
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .book-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-read {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #4f46e5;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-read:hover {
      background: #4338ca;
    }
    .btn-icon-action {
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-icon-action:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-delete {
      color: #f87171;
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: #1e2029;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 540px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      animation: modalSlideUp 0.25s ease-out;
    }
    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .form-label span.req {
      color: #f43f5e;
    }
    .form-control {
      width: 100%;
      background: #15161c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: #6366f1;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #4338ca;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(30, 32, 42, 0.95);
      border: 1px solid #4f46e5;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="brand" onclick="location.href='#'">
      <div class="brand-icon">📚</div>
      <div class="brand-title">
        <h1>글로벌인재포럼 & 지식 공유 디지털 서재</h1>
        <p>Global HR Forum & Shared Web PDF Archive</p>
      </div>
    </div>

    <div class="search-filter-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 연사명, 소속, 주제, 추천글 검색...">
    </div>

    <div class="header-actions">
      <button class="btn-add-pdf" id="openAddModalBtn">
        ➕ 인터넷 PDF 공유하기
      </button>
      <button class="btn-share-collection" id="shareMyCollectionBtn" title="내가 추가한 공유 목록을 링크로 만들어 팀원에게 전달">
        📤 내 공유 서재 링크
      </button>
    </div>
  </div>
</header>

<div class="controls-bar">
  <div class="day-tabs">
    <button class="day-tab-btn active" data-filter="ALL">전체 보기 <span class="badge-pill" id="badgeAll">0</span></button>
    <button class="day-tab-btn" data-filter="DAY1">DAY 1 (포럼) <span class="badge-pill" id="badgeDay1">0</span></button>
    <button class="day-tab-btn" data-filter="DAY2">DAY 2 (포럼) <span class="badge-pill" id="badgeDay2">0</span></button>
    <button class="day-tab-btn" data-filter="WEB">🌐 공유된 웹 PDF <span class="badge-pill" id="badgeWeb">0</span></button>
  </div>

  <div class="stats-container">
    <div class="stats-badge">
      총 표시 자료: <strong id="itemCountDisplay">0</strong> 권
    </div>
    <div class="stats-badge">
      포럼 원본: <strong>66권 (106.7 MB)</strong>
    </div>
  </div>
</div>

<main class="bookshelf-stage" id="bookshelfStage">
  <!-- Dynamic Shelves -->
</main>

<!-- Add PDF Modal -->
<div class="modal-backdrop" id="addPdfModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2>🌐 인터넷 PDF / 좋은 글 공유 등록</h2>
      <button class="modal-close" id="closeAddModalBtn">&times;</button>
    </div>
    <form id="addPdfForm">
      <div class="form-group">
        <label class="form-label">PDF 또는 문서 웹 링크 <span class="req">*</span></label>
        <input type="url" id="inputPdfUrl" class="form-control" placeholder="https://example.com/document.pdf" required>
      </div>
      <div class="form-group">
        <label class="form-label">문서 / 발표 제목 <span class="req">*</span></label>
        <input type="text" id="inputPdfTitle" class="form-control" placeholder="예: 생성형 AI 시대의 일과 조직 변화 가이드" required>
      </div>
      <div style="display: flex; gap: 12px;">
        <div class="form-group" style="flex: 1;">
          <label class="form-label">작성자 / 발표자</label>
          <input type="text" id="inputPdfSpeaker" class="form-control" placeholder="예: 홍길동">
        </div>
        <div class="form-group" style="flex: 1;">
          <label class="form-label">출처 / 소속 기관</label>
          <input type="text" id="inputPdfAffil" class="form-control" placeholder="예: OpenAI, HBR, 서울대 등">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">카테고리 / 분야</label>
        <select id="inputPdfCategory" class="form-control">
          <option value="AI & 미래기술">🤖 AI & 미래기술</option>
          <option value="HR & 리더십">👥 HR & 인재·리더십</option>
          <option value="비즈니스 & 경영">📈 비즈니스 & 경영 혁신</option>
          <option value="교육 & 자기개발">🎓 교육 & 학습 생태계</option>
          <option value="교양 & 에세이">📖 인문 교양 & 에세이</option>
          <option value="추천 아티클">⭐ 기타 추천 아티클</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">추천 이유 / 한줄 요약</label>
        <textarea id="inputPdfSummary" class="form-control" rows="3" placeholder="이 글이나 자료를 동료들에게 추천하는 이유나 핵심 포인트를 적어주세요."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelAddModalBtn">취소</button>
        <button type="submit" class="btn-primary">책장에 꽂기 📚</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toastBox">
  <span id="toastMsg">알림 메시지</span>
</div>

  // Handle incoming shared link (hash payload)
  function checkUrlSharePayload() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#share=')) {
      try {
        const b64 = hash.replace('#share=', '');
        const jsonStr = decodeURIComponent(escape(atob(b64)));
        const sharedItems = JSON.parse(jsonStr);
        if (Array.isArray(sharedItems) && sharedItems.length > 0) {
          let addedCount = 0;
          sharedItems.forEach(item => {
            if (!customPdfs.some(c => c.remote_url === item.remote_url)) {
              item.id = Date.now() + Math.floor(Math.random() * 1000);
              item.is_custom = true;
              item.day_code = 'WEB';
              item.day_title = '🌐 인터넷 공유 PDF 서재';
              customPdfs.unshift(item);
              addedCount++;
            }
          });
          if (addedCount > 0) {
            saveCustomPdfs(customPdfs);
            showToast(`동료가 공유한 ${addedCount}개의 웹 PDF를 책장에 등록했습니다! 🎉`);
          }
        }
      } catch (err) {
        console.error('Failed to parse share payload:', err);
      }
      // Clean up hash

  const toastMsg = document.getElementById('toastMsg');

  // Modal Elements
  const modal = document.getElementById('addPdfModal');
  const openAddModalBtn = document.getElementById('openAddModalBtn');
  const closeAddModalBtn = document.getElementById('closeAddModalBtn');
  const cancelAddModalBtn = document.getElementById('cancelAddModalBtn');
  const addPdfForm = document.getElementById('addPdfForm');
  const shareMyCollectionBtn = document.getElementById('shareMyCollectionBtn');

  let currentDayFilter = 'ALL';
  let searchQuery = '';
  const bannerClasses = ['banner-c1', 'banner-c2', 'banner-c3', 'banner-c4', 'banner-c5', 'banner-c6'];

  function showToast(msg) {
    toastMsg.innerText = msg;
    toastBox.style.display = 'flex';
    setTimeout(() => {
      toastBox.style.display = 'none';
    }, 2800);
  }

  function updateBadges() {
    const totalDay1 = initialCatalog.filter(i => i.day_code === 'DAY1').length;
    const totalDay2 = initialCatalog.filter(i => i.day_code === 'DAY2').length;
    const totalWeb = customPdfs.length;

    badgeAll.innerText = initialCatalog.length + totalWeb;
    badgeDay1.innerText = totalDay1;
    badgeDay2.innerText = totalDay2;
    badgeWeb.innerText = totalWeb;
  }

  function getAllItems() {
    return [...customPdfs, ...initialCatalog];
  }

  function renderBooks() {
    updateBadges();
    const allItems = getAllItems();

    const filtered = allItems.filter(it => {
      const matchDay = (currentDayFilter === 'ALL' || it.day_code === currentDayFilter);
      const text = `${it.speaker_name} ${it.speaker_affil} ${it.session_title} ${it.session_num} ${it.place} ${it.summary || ''}`.toLowerCase();
      const matchSearch = !searchQuery || text.includes(searchQuery.toLowerCase());
      return matchDay && matchSearch;
    });

    itemCountDisplay.innerText = filtered.length;

    if (filtered.length === 0) {
      stage.innerHTML = `<div class="empty-msg">검색 조건과 일치하는 발표 자료나 공유된 글이 없습니다.</div>`;
      return;
    }

    // Group by (Day + Session)
    const groups = {};
    filtered.forEach(it => {
      const groupKey = `${it.day_title} | ${it.session_num} - ${it.session_title}`;
      if (!groups[groupKey]) {
        groups[groupKey] = {
          day: it.day_title,
          session_num: it.session_num,
          session_title: it.session_title,
          place: it.place,
          time: it.time,
          is_web: it.day_code === 'WEB',
          items: []
        };
      }
      groups[groupKey].items.push(it);
    });

    let html = '';
    let groupIdx = 0;

    for (const [key, group] of Object.entries(groups)) {
      groupIdx++;
      let placeBadgeClass = 'badge-vista';
      if (group.is_web) placeBadgeClass = 'badge-web';
      else if (group.place && group.place.includes('워커')) placeBadgeClass = 'badge-walker';
      else if (group.place && group.place.includes('그랜드')) placeBadgeClass = 'badge-grand';

      html += `
        <section class="shelf-section">
          <div class="shelf-header">
            <div class="shelf-title">
              <span>${group.is_web ? '🌐' : '📖'} ${group.session_num}</span>
              <span style="font-weight: 500; font-size: 15px; color: #cbd5e1;">${group.session_title}</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
              ${group.time ? `<span style="font-size: 12px; color: #94a3b8;">⏰ ${group.time}</span>` : ''}
              ${group.place ? `<span class="shelf-badge ${placeBadgeClass}">📍 ${group.place}</span>` : ''}
            </div>
          </div>
          <div class="books-grid">
      `;

      group.items.forEach((it, bIdx) => {
        const bClass = it.is_custom ? 'banner-web' : bannerClasses[(it.id + groupIdx) % bannerClasses.length];
        const isExternal = it.rel_path.startsWith('http');
        const readLink = isExternal ? it.rel_path : it.rel_path;

        html += `
          <div class="book-card" id="card-${it.id}">
            <div class="book-banner ${bClass}">
              <div class="book-id-tag">
                <span>VOL. ${String(it.id).slice(-4)}</span>
                <span>${it.is_custom ? '🌐 WEB PDF' : it.day_code}</span>
              </div>
              <div class="book-title" title="${it.session_title}">${it.session_title}</div>
            </div>
            <div class="book-body">
              <div class="author-info">
                <div class="author-name">
                  👤 ${it.speaker_name || '작성자 미상'}
                  ${it.speaker_role ? `<span class="author-role">${it.speaker_role}</span>` : ''}
                </div>
                <div class="author-affil">${it.speaker_affil || '출처 정보 없음'}</div>
                ${it.summary ? `<div class="web-summary">💡 ${it.summary}</div>` : ''}
              </div>
              <div>
                <div class="book-meta">
                  <span>📄 ${it.size_mb || 'PDF'}</span>
                  <span>${it.place || '온라인'}</span>
                </div>
                <div class="book-actions">
                  <a href="${readLink}" target="_blank" rel="noopener noreferrer" class="btn-read">
                    📖 자료 열기
                  </a>
                  <button class="btn-icon-action" onclick="shareSingleItem(${it.id})" title="이 자료 공유 링크 복사">
                    🔗
                  </button>
                  ${it.is_custom ? `
                    <button class="btn-icon-action btn-delete" onclick="deleteCustomPdf(${it.id})" title="내 책장에서 삭제">
                      🗑️
                    </button>
                  ` : `
                    <a href="${it.remote_url}" target="_blank" rel="noopener noreferrer" class="btn-icon-action" title="원본 다운로드 URL">
                      ⬇️
                    </a>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </section>
      `;
    }

    stage.innerHTML = html;
  }

  // Share single item function
  window.shareSingleItem = function(id) {
    const all = getAllItems();
    const item = all.find(i => i.id === id);
    if (!item) return;

    const title = item.session_title;
    const shareUrl = item.remote_url || window.location.href;

    if (navigator.share) {
      navigator.share({
        title: `📚 [추천 자료] ${title}`,
        text: `${item.speaker_name} - ${title}\n${item.summary || ''}`,
        url: shareUrl
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('자료 링크가 클립보드에 복사되었습니다! 📋');
      }).catch(() => {
        prompt('자료 링크를 복사하세요:', shareUrl);
      });
    }
  };

  // Delete custom PDF
  window.deleteCustomPdf = function(id) {
    if (!confirm('이 자료를 내 서재에서 삭제하시겠습니까?')) return;
    customPdfs = customPdfs.filter(i => i.id !== id);
    saveCustomPdfs(customPdfs);
    renderBooks();
    showToast('자료가 서재에서 삭제되었습니다.');
  };

  // Modal Handlers
  openAddModalBtn.addEventListener('click', () => {
    modal.classList.add('open');
  });

  function closeModal() {
    modal.classList.remove('open');
    addPdfForm.reset();
  }

  closeAddModalBtn.addEventListener('click', closeModal);
  cancelAddModalBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Add PDF Form Submit
  addPdfForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const url = document.getElementById('inputPdfUrl').value.trim();
    const title = document.getElementById('inputPdfTitle').value.trim();
    const speaker = document.getElementById('inputPdfSpeaker').value.trim() || '작성자 미상';
    const affil = document.getElementById('inputPdfAffil').value.trim() || '공개 웹 자료';
    const category = document.getElementById('inputPdfCategory').value;
    const summary = document.getElementById('inputPdfSummary').value.trim();

    if (!url || !title) return;

    const newItem = {
      id: Date.now(),
      is_custom: true,
      day_code: 'WEB',
      day_title: '🌐 인터넷 공유 PDF 서재',
      session_num: category,
      session_title: title,
      place: affil,
      time: '인터넷 공유',
      speaker_name: speaker,
      speaker_role: '추천자료',
      speaker_affil: affil,
      remote_url: url,
      rel_path: url,
      size_mb: '웹 링크 PDF',
      summary: summary
    };

    customPdfs.unshift(newItem);
    saveCustomPdfs(customPdfs);
    closeModal();
    
    // Switch to WEB tab or render
    currentDayFilter = 'WEB';
    dayTabBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === 'WEB'));
    renderBooks();

    showToast('새로운 추천 PDF가 책장에 등록되었습니다! ✨');
  });

  // Share entire custom collection
  shareMyCollectionBtn.addEventListener('click', () => {
    if (customPdfs.length === 0) {
      alert('공유할 웹 PDF가 없습니다. 먼저 [➕ 인터넷 PDF 공유하기]로 좋은 자료를 등록해 보세요!');
      return;
    }
    try {
      const minimalData = customPdfs.map(i => ({
        session_num: i.session_num,
        session_title: i.session_title,
        speaker_name: i.speaker_name,
        speaker_affil: i.speaker_affil,
        remote_url: i.remote_url,
        summary: i.summary || ''
      }));
      const jsonStr = JSON.stringify(minimalData);
      const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
      const shareUrl = `${window.location.origin}${window.location.pathname}#share=${b64}`;

      if (navigator.share) {
        navigator.share({
          title: '📚 나의 추천 인터넷 PDF 서재 모음',
          text: `제가 추천하는 웹 PDF ${customPdfs.length}권을 공유합니다. 바로 열어보세요!`,
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('내 공유 서재 링크가 복사되었습니다! 팀원이나 동료에게 전달하세요. 🔗');
        }).catch(() => {
          prompt('공유 링크를 복사하세요:', shareUrl);
        });
      }
    } catch (err) {
      alert('공유 링크 생성 중 오류가 발생했습니다.');
    }
  });

  // Search and Filter Events
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderBooks();
  });

  dayTabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      dayTabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDayFilter = btn.dataset.filter;
      renderBooks();
    });
  });

  renderBooks();
</script>
</body>
</html>
